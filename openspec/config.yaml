schema: spec-driven

context: |
  acp-agent (acp-agent.kotlin): a JVM/Kotlin coding agent that speaks ACP over stdio to
  JetBrains IDEs. Read AGENTS.md before writing any artifact; the behavior lives in
  openspec/specs/<capability>/spec.md (one capability per spec, listed in AGENTS.md's
  "Behaviour map").

  Specs describe observable behavior only - ACP wire messages and error codes, tool
  semantics, configuration surface, permission and sandbox boundaries. Never internal
  class or function names, library choices, or step-by-step implementation; those belong
  in AGENTS.md and KDoc.

  Each requirement is pinned by a test, so spec and suite cannot drift apart. A requirement's
  scenarios name their tests in `- **Pinned by**` lines until it is converted; a converted
  requirement carries no pin lines and its test classes anchor it with
  `@Pins("<capability>", "<requirement>")`. Never author a new pin line - convert the requirement
  when work touches it. A scenario no test can pin says why instead: it relies on an upstream
  SDK, needs an environment the suite does not have, or rests on a judgement. `SpecPinsTest`
  enforces both modes: a scenario without a pin line in an unconverted requirement, a pin naming
  a class the test suite does not have or that runs no test, or a converted requirement without
  an annotation fails the build.
